<style>
:root{
  --bg:#f2f4f8; --card:#fff; --bd:#dde1ea; --txt:#15181f; --sub:#5a6272; --muted:#8a92a3;
  --brand:#1f3a5f; --blue:#2563eb; --green:#16a34a; --red:#e8192c; --amber:#f59e0b;
  --purple:#7c3aed; --pend:#fff7e6; --pendbd:#f5c26b; --chip:#eef1f6;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1218; --card:#181c24; --bd:#2a303c; --txt:#e8ebf1; --sub:#a4acbb; --muted:#79818f;
  --brand:#1b2c44; --chip:#232937; --pend:#2b2414; --pendbd:#7a5a1f; --blue:#60a5fa;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(84px + var(--safe-b))}
a{color:var(--blue);text-decoration:none}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:calc(10px + var(--safe-t)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .back{color:#fff;font-size:22px;padding:0 8px 0 0;background:none;border:0}
.hbtn{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:18px;padding:6px 12px;font-size:14px;font-weight:600}
.hbtn.warn{background:var(--amber);color:#111}
main{padding:12px 14px;max-width:720px;margin:0 auto}
.search{width:100%;font-size:17px;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--txt)}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--sub);font-size:14px}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--sub);margin:18px 2px 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.row{color:inherit;display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--card);border-bottom:1px solid var(--bd)}
.list{border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:6px 0}
.list .row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--chip);color:var(--sub);margin:2px 4px 2px 0}
.pend{background:var(--pend);border-color:var(--pendbd)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;background:var(--amber);color:#111;margin-left:6px;vertical-align:middle}
.over{color:var(--red);font-weight:600}.today{color:var(--amber);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 14px;border-radius:12px;border:0;background:var(--blue);color:#fff;font-size:16px;font-weight:600}
.btn.sec{background:var(--chip);color:var(--txt)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.block{width:100%;margin:6px 0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.grid4 .btn{flex-direction:column;font-size:12px;padding:10px 4px;gap:2px}
.grid4 .btn span{font-size:20px}
.contactbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:8px 0}
summary{padding:12px;font-weight:600;list-style:none;display:flex;align-items:center}
summary::-webkit-details-marker{display:none}
summary .n{margin-left:auto;color:var(--muted);font-weight:400;font-size:14px}
details[open] summary{border-bottom:1px solid var(--bd)}
.item{padding:10px 12px;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.item .meta{font-size:12px;color:var(--muted);margin-bottom:2px}
.item .body{white-space:pre-wrap;word-wrap:break-word}
.flag-1RED{border-left:4px solid var(--red)}.flag-2YELLOW{border-left:4px solid var(--amber)}.flag-3GREEN{border-left:4px solid var(--green)}
.empty{color:var(--muted);padding:12px;font-size:14px}
.fab{position:fixed;right:18px;bottom:calc(18px + var(--safe-b));width:58px;height:58px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
label.f{display:block;font-size:13px;color:var(--sub);margin:12px 2px 4px}
input.f,textarea.f,select.f{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-family:inherit}
textarea.f{min-height:120px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts label{flex:1;min-width:70px}
.opts input{display:none}
.opts span{display:block;text-align:center;padding:9px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--card);font-size:14px}
.opts input:checked+span{background:var(--brand);color:#fff;border-color:var(--brand)}
.check{display:flex;gap:10px;align-items:center;margin:12px 2px}
.check input{width:22px;height:22px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:.95}
.small{font-size:13px;color:var(--sub)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.kv b{color:var(--sub);font-weight:500}
.money{font-variant-numeric:tabular-nums}
.hidden{display:none}
.score{width:34px;height:34px;flex:none;border-radius:50%;border:3px solid var(--amber);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--sub)}
.score.hi{border-color:var(--green)}.score.lo{border-color:var(--red)}.score.na{border-color:var(--bd)}
.s.alert{color:var(--red)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:10px;margin:2px 4px 2px 0;background:var(--chip);color:var(--sub)}
.t-red{color:var(--red)}.t-amber{color:var(--amber)}.t-green{color:var(--green)}.t-blue{color:var(--blue)}.t-muted{color:var(--muted)}.t-main{color:var(--txt)}.t-sub{color:var(--sub)}
.pill.t-red{background:rgba(232,25,44,.12)}.pill.t-amber{background:rgba(245,158,11,.15)}.pill.t-blue{background:rgba(37,99,235,.12)}.pill.t-green{background:rgba(22,163,74,.12)}
.glance{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.gchip{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:0}
.gchip.b-red{border-top-color:var(--red)}.gchip.b-amber{border-top-color:var(--amber)}.gchip.b-green{border-top-color:var(--green)}.gchip.b-blue{border-top-color:var(--blue)}
.gchip .gt{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.gchip .gv{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.gchip .gs{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 12px}
.tile{border-radius:10px;padding:8px 4px;text-align:center;color:#fff}
.tile b{display:block;font-size:16px}.tile span{font-size:11px;opacity:.9}
.qhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.qhead .hl{font-weight:700;flex:1;min-width:120px}
.stat{font-size:11px;font-weight:700;color:#fff;padding:2px 6px;border-radius:6px;background:#6b7280}
.amt{font-weight:700;color:var(--green)}
.amt.box{color:#fff;background:var(--green);padding:2px 7px;border-radius:6px}
.tot{font-size:13px;font-weight:600;color:var(--green);margin-top:4px}
.ratebox{font-weight:700;color:var(--green)}
.grid4.g7{grid-template-columns:repeat(4,1fr)}
.lineed{border:1px solid var(--bd);border-radius:10px;padding:8px;margin:6px 0;background:var(--card)}
.lineed .lr{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:6px;align-items:end}
.lineed .x{background:none;border:0;color:var(--red);font-size:22px;padding:0 6px}
.lineed .hint{font-size:12px;color:var(--muted);margin-top:4px}
.totals{background:var(--chip);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.totals div{display:flex;justify-content:space-between}
.totals .gt{font-weight:700;font-size:16px;border-top:1px solid var(--bd);margin-top:4px;padding-top:4px}
.sigwrap{position:relative;background:#fff;border:2px dashed var(--bd);border-radius:12px;margin-top:6px}
#sig{display:block;width:100%;height:190px;touch-action:none;border-radius:12px}
.sigwrap .lbl{position:absolute;left:12px;bottom:10px;color:#aaa;font-size:13px;pointer-events:none}
.sigwrap .line{position:absolute;left:12px;right:12px;bottom:34px;border-top:1px solid #ccc;pointer-events:none}
.copy{background:none;border:0;color:var(--muted);font-size:13px;padding:0 4px}
</style>

<body>
<header id="hdr"><button class="back hidden" id="backBtn" aria-label="Back">‹</button><h1 id="title">Kempner</h1><button class="hbtn" id="syncBtn">Sync</button></header>
<main id="view"></main>
<button class="fab hidden" id="fab" aria-label="Add">+</button>
<input type="file" id="fileIn" class="hidden">
<div id="toast"></div>
<script>
"use strict";
/* ============================================================
   Kempner Mobile — offline companion to the Kempner CRM.
   Data lives only on this phone (IndexedDB). Nothing is sent
   anywhere except the files you choose to share yourself.
   ============================================================ */

// ---------- tiny IndexedDB key/value store ----------
const KV = (() => {
  let dbp;
  function db() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open("kempner-mobile", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function tx(mode, fn) {
    const d = await db();
    return new Promise((res, rej) => {
      const t = d.transaction("kv", mode); const st = t.objectStore("kv");
      const out = fn(st);
      t.oncomplete = () => res(out && out.result);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  return {
    get: k => tx("readonly", s => s.get(k)),
    set: (k, v) => tx("readwrite", s => s.put(v, k)),
  };
})();

// ---------- state ----------
let SNAP = null;        // last snapshot loaded from the CRM
let PENDING = [];       // events recorded on this phone, not yet confirmed by a snapshot
let META = { device: "", user: "", filter: "mine", lastExport: "" };
let IDX = null;

const CO_TABLES = ["company_owners","company_tags","people","addresses","actions","meetings","notes",
  "quick_notes","competitor_notes","quotes","film_orders","owned_equipment","company_known_film_specs",
  "company_pack_profiles","call_off_agreements","company_film_trials","reorder_orders"];

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
function localDate(d = new Date()) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function localTime(d = new Date()) { return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function nowIso() { const d = new Date(); return `${localDate(d)}T${localTime(d)}:${pad(d.getSeconds())}`; }
function stamp() { const d = new Date(); return `${localDate(d)}_${pad(d.getHours())}${pad(d.getMinutes())}`; }
function addDays(n) { const d = new Date(); d.setDate(d.getDate() + n); return localDate(d); }
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function niceDate(s) {
  if (!s) return "";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if (!m) return esc(s);
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  const t = localDate(), y = d.getFullYear() !== new Date().getFullYear() ? " " + m[1] : "";
  if (s.slice(0,10) === t) return "Today";
  if (s.slice(0,10) === addDays(1)) return "Tomorrow";
  if (s.slice(0,10) === addDays(-1)) return "Yesterday";
  return `${DOW[d.getDay()]} ${+m[3]} ${MON[+m[2]-1]}${y}`;
}
function dueClass(date) { const t = localDate(); return !date ? "" : date < t ? "over" : date === t ? "today" : ""; }
const money = v => (v == null || v === "" || isNaN(+v)) ? "" : "£" + (+v).toLocaleString("en-GB", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const num = v => (v == null || v === "" || isNaN(+v)) ? "" : String(+(+v).toFixed(3));
const norm = s => String(s || "").toLowerCase().replace(/[\s_\-.,'&]/g, "").replace(/(ltd|limited|plc)$/,"");
const digits = s => String(s || "").replace(/[^\d+]/g, "");
function toast(msg, ms = 2600) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); }

const STATUS_COL = {URGENT:"var(--red)",WARM:"var(--amber)",COLD:"#3b82f6",OK:"var(--green)",DEAD:"#6b7280",CONTACT:"var(--purple)",ARCHIVED:"#6b7280"};
const FLAG = {"1RED":"🔴","2YELLOW":"🟡","3GREEN":"🟢","4NONE":""};

// ---------- persistence ----------
async function load() {
  try {
    SNAP = await KV.get("snapshot") || null;
    PENDING = await KV.get("pending") || [];
    META = Object.assign(META, await KV.get("meta") || {});
  } catch (e) { toast("Storage error: " + e.message, 5000); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  buildIndex();
}
async function savePending() { await KV.set("pending", PENDING); buildIndex(); updateSyncBtn(); }
async function saveMeta() { await KV.set("meta", META); }

// ---------- index (snapshot + pending merged) ----------
function groupBy(rows, key) {
  const m = new Map();
  for (const r of rows || []) { const k = String(r[key]); if (!m.has(k)) m.set(k, []); m.get(k).push(r); }
  return m;
}
function tempMap() { return (SNAP && SNAP.company_temp_map) || {}; }
function evCoKey(ev) {
  if (ev.company_id != null) return String(ev.company_id);
  const m = tempMap()[ev.company_temp];
  return m != null ? String(m) : "t:" + ev.company_temp;
}
function buildIndex() {
  const t = (SNAP && SNAP.tables) || {};
  IDX = { co: new Map(), by: {}, person: {}, drawdowns: groupBy(t.call_off_drawdowns, "agreement_id"),
          users: new Map(((SNAP && SNAP.users) || []).map(u => [String(u.id), u.name])),
          products: (SNAP && SNAP.products) || {}, pend: new Map(), doneIds: new Map(), hay: new Map() };
  for (const c of t.companies || []) IDX.co.set(String(c.id), Object.assign({}, c, {_key: String(c.id)}));
  for (const name of CO_TABLES) IDX.by[name] = groupBy(t[name], "company_id");
  for (const name of ["phone_numbers","person_emails","person_dates"]) IDX.person[name] = groupBy(t[name], "person_id");
  // pending events
  for (const ev of PENDING) {
    if (ev.type === "company_new") {
      const k = evCoKey(ev);
      if (!IDX.co.has(k)) IDX.co.set(k, {_key: k, id: null, name: ev.data.name, status: "NONE",
        pipeline_stage: "", region: "", _pending: true, updated_at: ev.created_at});
    }
  }
  for (const ev of PENDING) {
    const k = evCoKey(ev);
    if (!IDX.pend.has(k)) IDX.pend.set(k, []);
    IDX.pend.get(k).push(ev);
    if (ev.type === "action_done") IDX.doneIds.set(ev.data.action_id, ev);
  }
}
function rows(table, key) { return (IDX.by[table] && IDX.by[table].get(String(key))) || []; }
function pend(key, type) { return (IDX.pend.get(String(key)) || []).filter(e => !type || e.type === type); }
function lineCalc(lines, vatRate, ship) {
  const rate = +vatRate || 0, sh = +ship || 0; let subtotal = 0;
  for (const l of lines) { const q = +(l.quantity || 1) || 1; const p = +(l.agreed_price || l.unit_price || l.quoted_price || 0) || 0; subtotal += q * p; }
  const vat = subtotal * rate + sh * rate;
  return {subtotal, shipping_cost: sh, vat_amount: vat, grand_total: subtotal + sh + vat};
}
function productList() { return Object.entries((SNAP && SNAP.products) || {}).map(([id, p]) => ({id, name: p.name, section: p.section || ""})).sort((a, b) => a.name.localeCompare(b.name)); }
function productByName(n) { n = String(n || "").trim().toLowerCase(); return productList().find(p => p.name.toLowerCase() === n) || null; }
function lastPrice(key, name) {
  const v = view(key) || {}; const n = String(name || "").toLowerCase();
  for (const g of v.order_groups || []) for (const l of g.lines || []) if (String(l.description).toLowerCase() === n && l.unit_price) return l.unit_price;
  for (const g of v.quote_groups || []) for (const l of g.lines || []) if (String(l.description).toLowerCase() === n && (l.agreed_price || l.quoted_price)) return l.agreed_price || l.quoted_price;
  return "";
}
function defaultVatPct() { const r = SNAP && SNAP.vat_rate != null ? +SNAP.vat_rate : 0.2; return String(Math.round(r * 10000) / 100); }
function pendingGroups(key, type) {
  return pend(key, type).map(ev => { const d = ev.data, ls = (d.lines || []).map(l => Object.assign({}, l, {description: l.description || l.product_name}));
    const g = Object.assign({}, d, lineCalc(ls, d.vat_rate, d.shipping_cost), {lines: ls, _pending: ev});
    g.headline = ls.length === 1 ? `${ls[0].description} · ${num(ls[0].quantity)}` : `${ls.length} line items`; return g; });
}
function phoneActionId(ev) { return "ph" + ev.id.replace(/-/g, "").slice(0, 8); }
function myUserId() {
  const name = META.user || (SNAP && SNAP.current_user) || "";
  for (const [id, n] of IDX.users) if (n === name) return id;
  return null;
}
function isMine(c) {
  if (c._pending) return true;
  const uid = myUserId(); if (!uid) return true;
  if (String(c.assigned_to) === uid) return true;
  return rows("company_owners", c.id).some(o => String(o.user_id) === uid);
}
function people(key) {
  const out = rows("people", key).map(p => Object.assign({}, p, {
    numbers: (IDX.person.phone_numbers.get(String(p.id)) || []),
    emails: (IDX.person.person_emails.get(String(p.id)) || []).map(e => e.email),
    dates: (IDX.person.person_dates.get(String(p.id)) || []),
  }));
  for (const ev of pend(key)) {
    if (ev.type === "contact_new") out.push({name: ev.data.name, org_role: ev.data.role || "", numbers: ev.data.numbers || [],
      emails: ev.data.emails || [], _pending: ev});
    if (ev.type === "company_new" && ev.data.contact_name) out.push({name: ev.data.contact_name,
      numbers: ev.data.phone ? [{number: ev.data.phone}] : [], emails: ev.data.email ? [ev.data.email] : [], _pending: ev});
  }
  return out;
}
function actions(key) {
  const out = rows("actions", key).map(a => {
    const d = IDX.doneIds.get(a.id);
    return d ? Object.assign({}, a, {status: "DONE", _doneEv: d}) : a;
  });
  for (const ev of pend(key, "action_new")) {
    const id = phoneActionId(ev); const d = IDX.doneIds.get(id);
    out.push({id, company_id: key, date: ev.data.date, time: ev.data.time, note: ev.data.note, tier: ev.data.tier,

function haystack(c) {
  let h = IDX.hay.get(c._key); if (h) return h;
  const parts = [c.name, c.region];
  for (const p of people(c._key)) { parts.push(p.name, ...(p.numbers || []).map(n => digits(n.number)), ...(p.emails || [])); }
  for (const a of rows("addresses", c._key)) parts.push(a.lines, a.city, a.postcode, (a.postcode || "").replace(/\s/g, ""));
  for (const t of rows("company_tags", c._key)) parts.push(t.tag);

function dayDiff(d) { if (!d) return 9999; const a = new Date(d.slice(0,10) + "T00:00:00"), b = new Date(localDate() + "T00:00:00"); return Math.round((a - b) / 86400000); }
function listSub(c) {

}

      ${v.reorder?`<div class="tile" style="background:#6b7280"><b style="font-size:12px">${esc(v.reorder.text.replace(/^\S+\s/,""))}</b><span>Film reorder</span></div>`:""}</div>`;

function form(title, back, fieldsHtml, saveLabel, onSave) {
  setHeader(title, back);
  $("#view").innerHTML = `<form id="frm" autocomplete="off">${fieldsHtml}<button class="btn block green" style="margin-top:18px" type="submit">${saveLabel}</button>
    <button class="btn block sec" type="button" id="cancel">Cancel</button></form>`;
  $("#cancel").onclick = () => history.back();
  $("#frm").onsubmit = async e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData($("#frm")).entries());
    for (const k in fd) if (typeof fd[k] === "string") fd[k] = fd[k].trim();
    try { const ok = await onSave(fd, $("#frm")); if (ok !== false) { toast("Saved on phone ✓"); history.back(); } }
    catch (err) { toast("Couldn't save: " + err.message, 5000); }
  };
}

function lineEdHtml(withShipping = true) {
  return `<datalist id="prods">${productList().map(p => `<option value="${esc(p.name)}">`).join("")}</datalist>
    <label class="f">Items</label><div id="lines"></div>
    <button type="button" class="btn sec sm" id="addLine">+ Add another item</button>
    <div class="two"><div><label class="f">VAT %</label><input class="f" id="vatPct" type="number" inputmode="decimal" step="any" value="${defaultVatPct()}"></div>
    ${withShipping?`<div><label class="f">Shipping £</label><input class="f" id="ship" type="number" inputmode="decimal" step="0.01" value="0"></div>`:"<div></div>"}</div>
    <div class="totals" id="totals"></div>`;
}
function initLineEd(key, mode, onChange) {
  const host = $("#lines");
  const add = () => {
    const d = document.createElement("div"); d.className = "lineed";
    d.innerHTML = `<input class="f" data-f="product" list="prods" placeholder="Product – pick from list or type" autocomplete="off">
      <div class="lr"><div><label class="f" style="margin-top:4px">Qty (rolls/units)</label><input class="f" data-f="qty" type="number" inputmode="decimal" step="any" value="1"></div>
      <div><label class="f" style="margin-top:4px">£ each (ex VAT)</label><input class="f" data-f="price" type="number" inputmode="decimal" step="0.01"></div>
      <button type="button" class="x" title="Remove">✕</button></div><div class="hint"></div>`;
    host.appendChild(d);
    const prod = d.querySelector("[data-f=product]"), price = d.querySelector("[data-f=price]"), hint = d.querySelector(".hint");
    prod.addEventListener("input", () => {
      const p = productByName(prod.value);
      if (p) { const lp = lastPrice(key, p.name); if (lp && !price.value) price.value = lp;
        hint.textContent = "✓ In your catalogue" + (lp ? ` · last price for them £${(+lp).toFixed(2)}` : ""); }
      else hint.textContent = prod.value.trim() ? (mode === "quote" ? "Not in catalogue – saved as typed" : "Not in catalogue – will be added to Products when imported") : "";
      update();
    });
    d.querySelector(".x").onclick = () => { if (host.children.length > 1) { d.remove(); update(); } };
    d.querySelectorAll("input").forEach(i => i.addEventListener("input", update));
    return d;
  };
  const read = () => [...host.children].map(d => {
    const name = d.querySelector("[data-f=product]").value.trim(), p = productByName(name);
    return {product_id: p ? +p.id : null, product_name: p ? p.name : name, description: p ? p.name : name, section: p ? (p.section || "Film") : "Film",
      quantity: +d.querySelector("[data-f=qty]").value || 0, price: +d.querySelector("[data-f=price]").value || 0};
  }).filter(l => l.description);
  const vat = () => (+($("#vatPct").value) || 0) / 100;
  const ship = () => $("#ship") ? (+$("#ship").value || 0) : 0;
  function update() {
    const c = lineCalc(read().map(l => ({quantity: l.quantity, unit_price: l.price})), vat(), ship());
    const g = n => "£" + n.toLocaleString("en-GB", {minimumFractionDigits: 2, maximumFractionDigits: 2});
    $("#totals").innerHTML = `<div><span>Goods</span><span>${g(c.subtotal)}</span></div>${c.shipping_cost?`<div><span>Shipping</span><span>${g(c.shipping_cost)}</span></div>`:""}
      <div><span>VAT</span><span>${g(c.vat_amount)}</span></div><div class="gt"><span>Total</span><span>${g(c.grand_total)}</span></div>`;
    if (onChange) onChange();
  }
  add();
  $("#addLine").onclick = () => { add().querySelector("input").focus(); };
  ["vatPct", "ship"].forEach(id => { const el = $("#" + id); if (el) el.addEventListener("input", update); });
  update();
  return {read, vat, ship, calc: () => lineCalc(read().map(l => ({quantity: l.quantity, unit_price: l.price})), vat(), ship())};
}

let _jspdfP;
function loadJsPDF() {

    sc.onload = res; sc.onerror = () => { _jspdfP = null; rej(new Error("PDF maker not downloaded yet – open the app once with signal")); }; document.head.appendChild(sc); }));

const pdfSafe = t => String(t ?? "").replace(/[—–]/g, "-").replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/…/g, "...").replace(/[^\x0A\x20-\x7E -ÿ]/g, "");
function longDate(d = new Date()) { return `${d.getDate()} ${["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()]} ${d.getFullYear()}`; }
function sigPad(canvas) {
  const ctx = canvas.getContext("2d"); let drawing = false, dirty = false, last = null;
  const fit = () => { const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    canvas.width = r.width * dpr; canvas.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0b1f4b"; dirty = false; };
  fit();
  const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  canvas.addEventListener("pointerdown", e => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); e.preventDefault(); });
  canvas.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; dirty = true; e.preventDefault(); });
  const end = () => { drawing = false; };

  return {clear: fit, isEmpty: () => !dirty, png: () => canvas.toDataURL("image/png")};
}
function makeSignoffPdf(o) {
  const {jsPDF} = window.jspdf; const doc = new jsPDF({unit: "pt", format: "a4"});

  doc.setFont("times", "bold"); doc.setFontSize(48); doc.setTextColor(255, 0, 0); doc.text("KEMPNER", W / 2, y, {align: "center"}); y += 26;
  doc.setTextColor(0, 0, 0); doc.setFontSize(10);
  for (const l of ["S. Kempner Limited", "498-500 Honeypot Lane, Stanmore, Middlesex, HA7 1JZ.", "Telephone: 020 8952 5262  Facsimile: 020 8952 8061", "www.kempner.co.uk"]) { doc.text(l, W / 2, y, {align: "center"}); y += 13; }
  y += 6; doc.setFont("times", "bolditalic"); doc.setFontSize(11);
  for (const l of ["THE COUNTRY'S LARGEST DISTRIBUTORS OF", "DISPLAY SHRINK MATERIALS AND MACHINERY.", "AND", "CERTIFICATED TO ISO 9001:2015"]) { doc.text(l, W / 2, y, {align: "center"}); y += 13; }
  y += 24;
  // customer block + date
  doc.setFont("times", "bold"); doc.setFontSize(12);
  const top = y; doc.text(pdfSafe(o.company), L, y); y += 15;
  doc.setFont("times", "normal"); doc.setFontSize(11);
  for (const l of o.addressLines) { if (l.trim()) { doc.text(pdfSafe(l), L, y); y += 13; } }
  doc.text(pdfSafe(o.dateText), R, top, {align: "right"});
  y += 10; doc.setFont("times", "bold"); doc.text(pdfSafe(`For the attention of ${o.person}${o.position ? ", " + o.position : ""}`), L, y); y += 26;
  doc.setFontSize(14); doc.text("Goods Left on Site - Customer Acknowledgement", L, y);
  doc.setLineWidth(0.6); doc.line(L, y + 3, L + doc.getTextWidth("Goods Left on Site - Customer Acknowledgement"), y + 3); y += 24;
  // table
  const g = n => "£" + (+n).toLocaleString("en-GB", {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const cols = [L, R - 190, R - 110, R];
  doc.setFontSize(11); doc.setFont("times", "bold");
  doc.text("Item", cols[0], y); doc.text("Qty", cols[1], y, {align: "right"}); doc.text("Unit price", cols[2], y, {align: "right"}); doc.text("Line total", cols[3], y, {align: "right"});
  y += 5; doc.line(L, y, R, y); y += 14; doc.setFont("times", "normal");

  tot("Goods", g(o.calc.subtotal)); if (o.calc.shipping_cost) tot("Shipping", g(o.calc.shipping_cost));
  tot(`VAT (${num(o.vatRate * 100)}%)`, g(o.calc.vat_amount)); tot("Total", g(o.calc.grand_total), true);
  y += 14;
  doc.setFont("times", "normal"); doc.setFontSize(12);
  const st = doc.splitTextToSize(pdfSafe(o.statement), CW); doc.text(st, L, y); y += 16 * st.length + 10;
  doc.setFontSize(11); doc.setFont("times", "italic");

  doc.setFont("times", "normal");
  doc.text(pdfSafe(`Name: ${o.person}${o.position ? "   Position: " + o.position : ""}`), L, y); y += 15;
  doc.text(pdfSafe(`Date & time signed: ${o.dateText}, ${o.timeText}`), L, y); y += 15;
  doc.text(pdfSafe(`For S. Kempner Limited: ${o.rep}`), L, y); y += 15;
  doc.setFontSize(8); doc.setTextColor(120);

}
function dataUriToFile(uri, name) {

async function sharePdf(uri, name) {

}

function describe(e) {

$("#fileIn").onchange = async e => {
